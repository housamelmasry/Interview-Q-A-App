# Local development stack. The API runs on 3000 and the Vite dev server on 5173.
#
# The bind mounts are for hot reload. Each service keeps an anonymous volume over
# /app/node_modules so the container's own Linux modules are used instead of the
# host's, which are the wrong platform and break native modules like sqlite3.
services:
  backend:
    build: ./backend
    container_name: app_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - data:/data
    environment:
      # The database lives in a named volume, so `docker compose down` does not
      # throw away the seeded content and it survives a rebuild.
      DB_PATH: /data/interview_guide.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: app_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
